name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.20', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Install official iperf3
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y iperf3
      - name: Install official iperf3
        if: runner.os == 'macOS'
        run: brew install iperf3
      - run: go vet ./...
      - run: go test -count=1 ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [android/arm64, linux/arm64, freebsd/amd64, windows/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build ${{ matrix.target }}
        run: |
          export GOOS=${TARGET%/*} GOARCH=${TARGET#*/}
          go vet ./...
          go build ./...
        env:
          TARGET: ${{ matrix.target }}
